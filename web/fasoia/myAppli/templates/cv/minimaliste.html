{% extends "cv/base_cv.html" %}

{% block extra_css %}
<style>
    body {
        font-family: 'Helvetica', 'Arial', sans-serif;
        max-width: 650px;
        margin: 0 auto;
        padding: 30px;
        color: #222;
    }
    
    h1 {
        font-size: 28px;
        font-weight: 300;
        letter-spacing: 1px;
        margin-bottom: 5px;
    }
    
    h2 {
        font-size: 16px;
        font-weight: 500;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: none;
        margin: 25px 0 15px 0;
        color: #555;
    }
    
    .contact-info {
        color: #777;
        font-size: 14px;
        border-bottom: 1px solid #eee;
        padding-bottom: 15px;
    }
    
    .experience-item, .formation-item {
        margin-bottom: 20px;
    }
    
    .item-header {
        font-weight: 500;
        margin-bottom: 3px;
    }
    
    .date {
        color: #999;
        font-size: 13px;
        font-weight: normal;
    }
    
    .company, .institution {
        color: #666;
        font-size: 14px;
        margin-bottom: 5px;
    }
    
    .description {
        color: #444;
        font-size: 14px;
        line-height: 1.5;
    }
    
    .skills {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
    }
    
    .skill-tag {
        background: #f5f5f5;
        color: #333;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 13px;
    }
    
    ul {
        list-style-type: none;
        padding: 0;
    }
    
    li {
        margin-bottom: 5px;
        font-size: 14px;
    }
</style>
{% endblock %}
